[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missionmind"
version = "0.1.0"
description = "AI-powered autonomous mission planning for a simulated Mars rover"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["missionmind*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
